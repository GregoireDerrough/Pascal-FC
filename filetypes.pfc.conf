# For complete documentation of this file, please see Geany's main documentation
# lexer file for Pascal-FC (Functionally concurrent, a subset) syntax highlight [greg]
[styling=Pascal]

[keywords]
# all items must be in one line
# uses different keywords from pascal.conf [greg]
primary=accept address and array at begin case channel cobegin coend const div do else end entry export for forever forward function guarded if in mod monitor not null of offset or pri procedure process program provides record repeat replicate requeue resource select terminate then timeout to type until var when while

[lexer_properties]
# only highlight keywords like read,write if in appropriate context
# do not need this, Pascal-FC doesn't use objects, which is where this is applied [greg]
lexer.pascal.smart.highlighting=0

[settings]
# default extension used when saving files
extension=pfc
lexer_filetype=Pascal

# MIME type
# not sure what to do here? [greg]
#mime_type=text/x-pascal

# these characters define word boundaries when making selections and searching
# using word matching options
#wordchars=_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# single comments, like # in this file
#comment_single=
# multiline comments
#comment_open={
#comment_close=}

# set to false if a comment character/string should start at column 0 of a line, true uses any
# indentation of the line, e.g. setting to true causes the following on pressing CTRL+d
# 		#command_example();
# setting to false would generate this
# #		command_example();
# This setting works only for single line comments
#comment_use_indent=true

# context action command (please see Geany's main documentation for details)
#context_action_cmd=

[indentation]
width=2
# 0 is spaces, 1 is tabs, 2 is tab & spaces
type=1

[build_settings]
# %f will be replaced by the complete filename
# %e will be replaced by the filename without extension
# still needs work, not fully functional [greg]
#compiler=pfc.bat "%f"
#run_cmd="./%e"
